# OpenMail production stack: the MCP server, Caddy for HTTPS, and an
# internal-only GreenMail demo mailbox for marketplace reviewers.
# Secrets live in ./.env on the server (gitignored, chmod 600). See docs/deploy.md.
name: openmail

# Container stdout logs are size-capped. Caddy access logs go to a file with
# 14-day retention instead (see deploy/Caddyfile).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  openmail:
    build: .
    logging: *logging
    image: openmail:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OPENMAIL_CONFIG: /config/config.toml
      OPENMAIL_DB_PATH: /data/openmail.db
      OPENMAIL_TRUST_PROXY: "1"
      # Plain IMAP is allowed only for this exact internal host.
      OPENMAIL_INSECURE_IMAP_HOSTS: demo-mail
      OPENMAIL_INSECURE_SMTP_HOSTS: demo-mail
      OPENMAIL_DEMO_IMAP_HOST: demo-mail
      OPENMAIL_DEMO_IMAP_PORT: "3143"
      OPENMAIL_DEMO_IMAP_USER: demo
    volumes:
      - ./deploy/openmail.toml:/config/config.toml:ro
      - openmail-data:/data
    # No published ports: only Caddy reaches it over the private Docker network.
    # "backend" is not internal because OpenMail must open outbound
    # IMAP/SMTP connections (993/465/587) to mailbox providers.
    expose:
      - "8080"
    networks:
      - backend
      - demo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Reviewer demo mailbox. Plain IMAP on an internal network with no
  # published ports and no internet access; only OpenMail can reach it.
  # The password is in GREENMAIL_OPTS so `docker inspect` can read it;
  # that is accepted because the mailbox is fictional and network-isolated.
  demo-mail:
    image: greenmail/standalone:2.1.3
    logging: *logging
    restart: unless-stopped
    # The image's own start script echoes GREENMAIL_OPTS (which holds the demo
    # password) to the log. Start java directly instead.
    entrypoint: ["/bin/sh", "-c", "exec java $$JAVA_OPTS $$GREENMAIL_OPTS -jar greenmail-standalone.jar"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=demo:${OPENMAIL_DEMO_PASSWORD:?set OPENMAIL_DEMO_PASSWORD in .env}@demo.openmail.tools
      JAVA_OPTS: -Xmx192m
    networks:
      - demo
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3143'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    logging: *logging
    restart: unless-stopped
    depends_on:
      openmail:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENMAIL_DOMAIN: ${OPENMAIL_DOMAIN:-mcp.openmail.tools}
      OPENMAIL_ROOT_DOMAIN: ${OPENMAIL_ROOT_DOMAIN:-openmail.tools}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend

networks:
  backend: {}
  demo:
    internal: true

volumes:
  openmail-data:
  caddy-data:
  caddy-config:
