# OpenMail server config used by docker-compose.yml. No secrets in this file.
# Multi-user mode: users, mailboxes and API keys live in the SQLite database,
# encrypted with OPENMAIL_MASTER_KEY from .env.
mode = "multi"
allow_insecure_localhost = false

[server]
# Listen on all interfaces inside the container; the port is not published,
# only Caddy on the internal Docker network can reach it.
host = "0.0.0.0"
port = 8080
