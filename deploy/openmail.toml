# OpenMail server config used by docker-compose.yml. No secrets in this file.
# Single-user mode: bearer keys come from OPENMAIL_API_KEYS in .env.
# Mailbox passwords, when accounts are added, also go in .env via password_env.
mode = "single"
allow_insecure_localhost = false

[server]
# Listen on all interfaces inside the container; the port is not published,
# only Caddy on the internal Docker network can reach it.
host = "0.0.0.0"
port = 8080

# No accounts yet. To add one, append [[accounts]] blocks at the end of this
# file as shown in config.example.toml, and put each password in .env.
