name: openmail-test

services:
  greenmail:
    image: greenmail/standalone:2.1.3
    ports:
      - "${OPENMAIL_TEST_SMTP_PORT:-13025}:3025"
      - "${OPENMAIL_TEST_IMAP_PORT:-13143}:3143"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:test@localhost"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3143'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
